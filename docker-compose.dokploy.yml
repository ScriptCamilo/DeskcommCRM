# Stack da distribuicao ScriptCamilo para Dokploy.
#
# O Dokploy assume dominio, TLS, Traefik, rede publica e ciclo de deploy. Este
# arquivo cuida somente da aplicacao e de suas dependencias internas. Supabase e
# migrations permanecem externos ao ciclo de boot.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# O painel injeta variaveis no processo do Docker Compose. A interpolacao abaixo
# as entrega explicitamente aos containers, sem depender de um arquivo .env.
